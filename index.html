<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>🎂 Happy Birthday Surprise!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff8e7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        .box {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 179, 0, 0.15);
            text-align: center;
            width: 90%;
            max-width: 360px;
            border: 2px dashed #ffb300;
        }

        /* 蛋糕和蜡烛 */
        .cake-container {
            font-size: 70px;
            cursor: pointer;
            position: relative;
            display: inline-block;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        .cake-container:active { transform: scale(0.95); }

        .flame {
            font-size: 28px;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.8s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        }

        h2 { color: #d84315; margin-bottom: 8px; font-size: 22px; }
        p.sub { font-size: 13px; color: #8d6e63; margin-bottom: 20px; }

        /* 刮刮乐卡片 */
        .scratch-card {
            background: #ffecb3;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .prize-text {
            font-size: 16px;
            font-weight: bold;
            color: #e65100;
        }

        .cover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b0bec5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #37474f;
            font-size: 13px;
            font-weight: bold;
            transition: opacity 0.4s ease;
        }

        .cover-overlay.revealed {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- 【可修改部分】：被祝福人生日名字 -->
        <h2>🎉 Happy Birthday to 小美!</h2>
        <p class="sub">👉 点击蜡烛吹灭它并许个愿 👈</p>

        <div class="cake-container" id="cake" onclick="blowCandle()">
            <div class="flame" id="flame">🔥</div>
            🎂
        </div>

        <p id="wishStatus" style="font-size: 14px; color: #e65100; font-weight: bold; min-height: 20px;"></p>

        <!-- 刮刮乐趣味抽奖区 -->
        <div class="scratch-card" onclick="revealPrize()">
            <!-- 【可修改部分】：藏在刮刮乐底下的礼物/承诺 -->
            <div class="prize-text">🎁 获得：兑现任意愿望券 ×1 + 奶茶一杯！</div>
            <div class="cover-overlay" id="overlay">✨ 点击刮开你的专属生日礼物 ✨</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let isBlown = false;

        function blowCandle() {
            if (isBlown) return;
            isBlown = true;
            document.getElementById('flame').style.display = 'none';
            document.getElementById('wishStatus').innerText = "✨ 愿望已送达银河系，岁岁皆胜意！";

            // 触发全屏五彩纸屑
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function revealPrize() {
            document.getElementById('overlay').classList.add('revealed');
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 }
            });
        }
    </script>
</body>
</html>
