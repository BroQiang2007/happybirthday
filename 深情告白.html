<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Our Special Story ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        /* 拍立得相框卡片 */
        .polaroid {
            background: #ffffff;
            padding: 15px 15px 25px 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform: rotate(-3deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border-radius: 4px;
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 105, 180, 0.3);
        }

        .photo-box {
            width: 250px;
            height: 250px;
            background: #eee;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid-caption {
            color: #333;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .title {
            margin-top: 30px;
            font-size: 22px;
            font-weight: 600;
            color: #ffd1dc;
            text-shadow: 0 0 10px rgba(255, 209, 220, 0.5);
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.8;
            color: #cfd8dc;
            padding: 0 10px;
        }

        .days-counter {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>

    <div class="container">
        <div class="polaroid" onclick="alert('你是我最想留住的幸运 ✨')">
            <div class="photo-box">
                <!-- 【可修改部分】：替换图片链接或本地照片 -->
                <img src="baoshangen.jpg">
            </div>
            <!-- 【可修改部分】：相框下方文字与日期 -->
            <div class="polaroid-caption">Our Unforgettable Moment 💖</div>
        </div>

        <!-- 【可修改部分】：主标题与名字 -->
        <div class="title">To: 亲爱的宝贝</div>
        
        <!-- 【可修改部分】：深情长文案 -->
        <div class="message">
            星河滚烫，你是人间理想。<br>
            感谢你走进我的生命，让每一个平凡的日子都充满期待。
        </div>

        <!-- 【可修改部分】：纪念日天数 -->
        <div class="days-counter">我们已经在一起 <b>520</b> 天啦 💫</div>
    </div>

    <script>
        // 流星与繁星背景绘制
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const stars = Array.from({ length: 80 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5,
            alpha: Math.random()
        }));

        const meteors = [];

        function addMeteor() {
            meteors.push({
                x: Math.random() * width,
                y: 0,
                length: Math.random() * 80 + 20,
                speed: Math.random() * 10 + 6,
                angle: Math.PI / 4
            });
        }

        setInterval(addMeteor, 2000);

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 绘制星星
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });

            // 绘制流星
            meteors.forEach((meteor, index) => {
                ctx.beginPath();
                ctx.moveTo(meteor.x, meteor.y);
                ctx.lineTo(meteor.x - meteor.length, meteor.y + meteor.length);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                meteor.x += meteor.speed;
                meteor.y += meteor.speed;

                if (meteor.y > height || meteor.x > width) {
                    meteors.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
